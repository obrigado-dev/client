# The plugin's version. The running descriptor reports it as `surface_version` (A30), so this is
# the one place it is written down.
pluginVersion = 0.0.0

# Compiled against the OLDEST platform it claims to support, so a call that does not exist
# there fails here rather than in somebody's IDE. `sinceBuild` in build.gradle.kts must agree.
platformVersion = 2025.1

# The IDE ships the Kotlin standard library and every plugin shares it. Bundling a second copy
# is at best dead weight and at worst a class-loading conflict.
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
