# Advisories this repository has judged not to apply, each with its reason and a date to look
# again. osv-scanner reads this file from beside the lockfile it scans: see
# .github/workflows/dependency-audit.yml.
#
# An entry here is a decision, not a silence: it names why the flaw cannot be reached from
# this code, and it expires, so the audit goes red again and somebody checks whether a fix has
# shipped or the reasoning has stopped being true.

