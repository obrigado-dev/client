name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    # The editors' builds share the job (A40): the JetBrains one downloads its IDE platform on a
    # cold Gradle cache, which is most of the time added here.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The tag must be the version the binary reports. `CLIENT_VERSION` is what every install
      # sends as `client_version`, and `version.test.ts` holds it to the manifest; this holds the
      # tag to the manifest. Without both, a release could go out still reporting 0.0.0: the
      # self-update (A38) compares that number with the tag, and the notice line (A30), targeted
      # by version, is the only way to reach an install that does not update itself.
      - name: The tag is the version the binary reports
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          manifest="packages/client/package.json"
          version="$(bun -e "console.log(JSON.parse(await Bun.file('$manifest').text()).version)")"
          if [ "$version" = "0.0.0" ]; then
            echo "$manifest is still 0.0.0: bump it (and CLIENT_VERSION) before tagging" >&2
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "tag says $TAG but $manifest says $version" >&2
            exit 1
          fi

      - run: bun install --frozen-lockfile

      # The same gate CI runs. A tag is not a reason to publish something that does not pass —
      # and this is the artifact people `curl | sh`, so it is the last place to find out.
      - run: bun run check

      # One runner builds every platform: `bun build --compile` cross-compiles, so there is no
      # matrix and no chance of five jobs disagreeing about which commit they built.
      - run: bun run build:binaries

      # The editor surfaces ship in the same release, stamped with its version, and their sums
      # join the binaries' before the signature is made (A40). The toolchain is the CI job's.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - run: bun run build:editors

      # Signed before anything is published (§3, A38). The private key exists only as this
      # secret, and without it this step fails rather than publish a release every self-updating
      # install would refuse. It checks its own signature against the keys compiled into the
      # client, so a secret that does not match the committed key stops the release here too.
      - name: Sign the checksums
        env:
          OBRIGADO_RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: bun scripts/sign-release.ts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            dist/binaries/obrigado-* \
            dist/binaries/editors.json \
            dist/binaries/SHA256SUMS \
            dist/binaries/SHA256SUMS.sig

      # Proof the published artifact is the one that was built. `install.sh` verifies the same
      # file against the same list; this checks the list actually describes what went up.
      - name: Verify what was published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p verify && cd verify
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern 'obrigado-*' --pattern 'editors.json' --pattern 'SHA256SUMS' --pattern 'SHA256SUMS.sig'
          sha256sum -c SHA256SUMS
          bun ../scripts/sign-release.ts --verify .

  # The same binaries on npm (A44), for `npm install -g @obrigado/client` and the rest: a package
  # per platform carrying the release's binary byte for byte, and @obrigado/client, which installs
  # the one that fits. A job of its own so that only it holds a token npm accepts, and so a failure
  # here is re-run alone: the GitHub release is already out.
  npm:
    needs: binaries
    runs-on: ubuntu-latest
    # Most of it waiting for npm to make the platform packages installable (Publish, below).
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # npm ≥ 11.5 speaks trusted publishing; the runner's Node ships an older one.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      # What goes to npm is what went to GitHub, held to the signed checksums the way install.sh
      # and the self-update hold it.
      - name: Download what was published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist/release && cd dist/release
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern 'obrigado-*' --pattern 'editors.json' --pattern 'SHA256SUMS' --pattern 'SHA256SUMS.sig'
          sha256sum -c SHA256SUMS
          bun ../../scripts/sign-release.ts --verify .

      - run: bun scripts/npm-packages.ts dist/release dist/npm

      # Through npm trusted publishing (OIDC), which each of the six packages names this workflow
      # for; their first version went out by hand (docs/PUBLISHING.md). A version already on the
      # registry is done, so a re-run publishes only what is missing. The platform packages go
      # first, and @obrigado/client only once npm serves every one of them: it names each at this
      # exact version, and npm took over ten minutes to make 0.3.11's linux-x64 pair installable,
      # which would have left a Linux machine with a launcher and nothing beside it to run.
      - name: Publish
        run: |
          set -eu
          spec() {
            bun -e "const m = JSON.parse(await Bun.file('$1/package.json').text()); console.log(m.name + '@' + m.version)"
          }
          publish() {
            if npm view "$(spec "$1")" version > /dev/null 2>&1; then
              echo "$(spec "$1") is already published"
              return
            fi
            npm publish "$1" --provenance --access public
            echo "## Published: \`$(spec "$1")\`" >> "$GITHUB_STEP_SUMMARY"
          }
          for dir in ./dist/npm/client-*; do publish "$dir"; done
          for dir in ./dist/npm/client-*; do
            tries=0
            until npm view "$(spec "$dir")" version > /dev/null 2>&1; do
              tries=$((tries + 1))
              if [ "$tries" -gt 60 ]; then
                echo "$(spec "$dir") is not installable after 30 minutes: @obrigado/client not published" >&2
                exit 1
              fi
              sleep 30
            done
          done
          publish ./dist/npm/client
