name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The tag must be the version the binary reports. `CLIENT_VERSION` is what every install
      # sends as `client_version`, and `version.test.ts` holds it to the manifest; this holds the
      # tag to the manifest. Without both, a release could go out still reporting 0.0.0: the
      # self-update (A38) compares that number with the tag, and the notice line (A30), targeted
      # by version, is the only way to reach an install that does not update itself.
      - name: The tag is the version the binary reports
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          manifest="packages/client/package.json"
          version="$(bun -e "console.log(JSON.parse(await Bun.file('$manifest').text()).version)")"
          if [ "$version" = "0.0.0" ]; then
            echo "$manifest is still 0.0.0: bump it (and CLIENT_VERSION) before tagging" >&2
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "tag says $TAG but $manifest says $version" >&2
            exit 1
          fi

      - run: bun install --frozen-lockfile

      # The same gate CI runs. A tag is not a reason to publish something that does not pass —
      # and this is the artifact people `curl | sh`, so it is the last place to find out.
      - run: bun run check

      # One runner builds every platform: `bun build --compile` cross-compiles, so there is no
      # matrix and no chance of five jobs disagreeing about which commit they built.
      - run: bun run build:binaries

      # Signed before anything is published (§3, A38). The private key exists only as this
      # secret, and without it this step fails rather than publish a release every self-updating
      # install would refuse. It checks its own signature against the keys compiled into the
      # client, so a secret that does not match the committed key stops the release here too.
      - name: Sign the checksums
        env:
          OBRIGADO_RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: bun scripts/sign-release.ts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            dist/binaries/obrigado-* \
            dist/binaries/SHA256SUMS \
            dist/binaries/SHA256SUMS.sig

      # Proof the published artifact is the one that was built. `install.sh` verifies the same
      # file against the same list; this checks the list actually describes what went up.
      - name: Verify what was published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p verify && cd verify
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern 'obrigado-*' --pattern 'SHA256SUMS' --pattern 'SHA256SUMS.sig'
          sha256sum -c SHA256SUMS
          bun ../scripts/sign-release.ts --verify .
