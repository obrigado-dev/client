name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run package:browser
      - run: bunx playwright install --with-deps chromium
        working-directory: packages/browser-extension
      - run: bun run test:browser
        working-directory: packages/browser-extension
      - uses: actions/upload-artifact@v7
        with:
          name: obrigado-browser-${{ github.sha }}
          path: packages/browser-extension/.output/*.zip
          if-no-files-found: error
      # vsce runs under Node, not Bun (its bin is `#!/usr/bin/env node`), and 4.0 requires
      # Node 22. Pinned rather than left to whatever the runner image ships.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun run package:vscode

      - uses: actions/upload-artifact@v7
        with:
          name: obrigado-vscode-${{ github.sha }}
          path: packages/vscode-extension/dist/obrigado-vscode.vsix
          if-no-files-found: error

  # Windows (A46). The release cross-compiles its Windows builds on Linux and nothing else here
  # runs on Windows, so this does: the tests whose subject is Windows where it is real (a binary
  # replaced while it runs, a chained status line in Git Bash, a tree killed with taskkill), then
  # the x64 build installed and rendered the way Claude Code renders a status line, through Git
  # Bash, Windows PowerShell and PowerShell 7 (`scripts/windows-smoke.ps1`).
  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: >-
          bun test
          packages/client/test/self-update.test.ts
          packages/client/test/renderer-command.test.ts
          packages/client/test/statusline.test.ts
          packages/client/test/chain.test.ts
          packages/client/test/claude-desktop.test.ts
          packages/client/test/jetbrains-ides.test.ts
          packages/client/test/editor-extension.test.ts
          packages/client/test/build-binaries.test.ts
          packages/surface/test

      - run: bun scripts/build-binaries.ts windows-x64

      - name: Install, render and uninstall, as Claude Code runs a status line
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -Binary dist/binaries/obrigado-windows-x64.exe

  # The JetBrains plugin is Kotlin, so it has its own toolchain and its own job. `check` runs the
  # unit tests, including the vectors that hold its copy of `@obrigado/surface` to the TypeScript
  # one. The Plugin Verifier is not run here: it downloads several IDE releases, and it is a
  # release step (docs/PUBLISHING.md), not a per-push one.
  jetbrains:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/jetbrains-plugin

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Also validates the committed wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew check buildPlugin

      - uses: actions/upload-artifact@v7
        with:
          name: obrigado-jetbrains-${{ github.sha }}
          path: packages/jetbrains-plugin/build/distributions/*.zip
          if-no-files-found: error
