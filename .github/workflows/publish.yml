name: Publish

# Publishes one workspace package to npm.
#
# Triggered by a per-package tag — `surface-v0.1.0` publishes `packages/surface` at 0.1.0 —
# or by hand. The binaries have their own `v*` tags and their own workflow; a package
# version is not a CLI version, so the two are not made to share a number.
#
# Auth is npm trusted publishing (OIDC), not a token: `id-token: write` below lets npm
# verify that this workflow, in this repository, produced the tarball, and `--provenance`
# records that on the package page. It needs a trusted publisher configured on npmjs.com
# for each package (repository `obrigado-dev/client`, workflow `publish.yml`). A package
# that does not exist yet cannot have one, so the first version of each package is
# published by hand — see docs/PUBLISHING.md.
#
# It publishes directly: the trusted publisher on npmjs.com allows `npm publish`, so a tag is
# a release, with no approval after it. What stands between a tag and the registry is what
# runs here — the full gate, and a tag that must name the version the manifest already
# commits — and the provenance attestation records which workflow run built the tarball.
# Until 2026-10-03 it staged instead and a maintainer approved each version with 2FA; that
# step was dropped as friction on every release.

on:
  push:
    tags: ["*-v*"]
  workflow_dispatch:
    inputs:
      package:
        description: "Directory under packages/ (e.g. surface)"
        required: true
        default: "surface"
      tag:
        description: "npm dist-tag"
        required: false
        default: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # npm ≥ 11.5 speaks trusted publishing; the runner's Node ships an older one.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      # The same gate CI runs. A tag is not a reason to publish something that does not pass.
      - run: bun run check

      - name: Resolve the package and version
        id: target
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "push" ]; then
            # `<package>-v<version>`; the version must be the manifest's, so a tag cannot
            # publish a number nobody committed.
            package="${REF_NAME%-v*}"
            tagged="${REF_NAME##*-v}"
            dist_tag="latest"
          else
            package="$INPUT_PACKAGE"
            tagged=""
            dist_tag="${INPUT_TAG:-latest}"
          fi
          manifest="packages/$package/package.json"
          [ -f "$manifest" ] || { echo "no such package: $package" >&2; exit 1; }
          version="$(bun -e "console.log(JSON.parse(await Bun.file('$manifest').text()).version)")"
          if [ -n "$tagged" ] && [ "$tagged" != "$version" ]; then
            echo "tag says $tagged but $manifest says $version" >&2
            exit 1
          fi
          name="$(bun -e "console.log(JSON.parse(await Bun.file('$manifest').text()).name)")"
          private="$(bun -e "console.log(JSON.parse(await Bun.file('$manifest').text()).private === true)")"
          echo "private=$private" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"

      # A version that is already on the registry is done, not an error. The first version of
      # a package is published by hand (see docs/PUBLISHING.md) and then tagged, and that tag
      # must not fail this workflow; a re-run of a tag must not either.
      # A private workspace is not an npm package. The mod's `claude-code-mod-v<version>` tags
      # match this workflow's pattern because they name a release the same way, but what they
      # release is a ref the marketplace pins (A37), so there is nothing here to publish.
      - name: A marketplace release, not an npm one
        if: steps.target.outputs.private == 'true'
        env:
          SPEC: ${{ steps.target.outputs.name }}@${{ steps.target.outputs.version }}
        run: |
          echo "$SPEC is private: released by its tag, not to npm"
          echo "## Released by tag, not to npm: \`$SPEC\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Already on the registry?
        if: steps.target.outputs.private != 'true'
        id: registry
        env:
          SPEC: ${{ steps.target.outputs.name }}@${{ steps.target.outputs.version }}
        run: |
          if npm view "$SPEC" version > /dev/null 2>&1; then
            echo "$SPEC is already published; nothing to do"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Packed by bun, published by npm. bun rewrites `workspace:*` to the real version and
      # runs `prepack` (the build); npm is what signs the provenance attestation.
      - name: Pack
        if: steps.target.outputs.private != 'true' && steps.registry.outputs.published != 'true'
        working-directory: packages/${{ steps.target.outputs.package }}
        run: |
          rm -rf ../../dist/npm && mkdir -p ../../dist/npm
          bun pm pack --destination ../../dist/npm

      - name: Publish
        if: steps.target.outputs.private != 'true' && steps.registry.outputs.published != 'true'
        run: npm publish dist/npm/*.tgz --provenance --access public --tag "${{ steps.target.outputs.dist_tag }}"

      - name: Summary
        if: steps.target.outputs.private != 'true' && steps.registry.outputs.published != 'true'
        env:
          SPEC: ${{ steps.target.outputs.name }}@${{ steps.target.outputs.version }}
        run: |
          echo "## Published: \`$SPEC\`" >> "$GITHUB_STEP_SUMMARY"
